name: ROS 2 Jazzy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ros2-jazzy:
    name: quality/build
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve ROS dependencies
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-rosdep python3-jsonschema python3-yaml ros-jazzy-rmw-fastrtps-cpp ros-jazzy-rmw-cyclonedds-cpp
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros2 --ignore-src --rosdistro jazzy -y

      - name: Verify interfaces and consumers
        env:
          VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/verify.sh

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-jazzy-evidence
          path: |
            .verification/run.*/verification.log
            .verification/run.*/result.txt
            .verification/run.*/generated-interfaces.log
            .verification/run.*/navigation-exchange-*.log
            .verification/run.*/reverted-consumer.log
            .verification/run.*/reverted-interface.patch
            .verification/run.*/interface-snapshot.json
            .verification/run.*/compatibility.json
            .verification/run.*/compatibility.log
            .verification/run.*/lint-schema.json
            .verification/run.*/lint-schema.log
            .verification/run.*/producer-retired/log/
            .verification/run.*/producer/log/
            .verification/run.*/consumer/log/
            .verification/run.*/reverted/log/
          include-hidden-files: true
          if-no-files-found: warn
